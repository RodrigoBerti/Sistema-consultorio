
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Consultório Odontológico{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fa;
        }

        .sidebar{
            width:250px;
            min-height:100vh;
            background:#0f4c81;
        }

        .sidebar a{
            color:white;
            text-decoration:none;
            display:block;
            padding:12px 20px;
        }

        .sidebar a:hover{
            background:#1565a9;
        }

        .content{
            flex:1;
        }

        .topbar{
            height:70px;
            background:white;
            border-bottom:1px solid #ddd;
        }
    </style>
</head>

<body>

<div class="d-flex">

    <div class="sidebar">

        <h3 class="text-white text-center py-4">
            🦷 Clínica
        </h3>

        <a href="/">Dashboard</a>
        <a href="/pacientes/">Pacientes</a>
        <a href="{% url 'financeiro:painel' %}">Financeiro</a>
        <a href="#">Relatórios</a>
        <a href="/admin/">Admin</a>

    </div>

    <div class="content">

        <div class="topbar d-flex justify-content-between align-items-center px-4">

            <h4 class="mb-0">
                Sistema do Consultório
            </h4>

            <span>Olá, Rodrigo</span>

        </div>

        <div class="container-fluid p-4">

            {% block content %}{% endblock %}

        </div>

    </div>

</div>

</body>
</html>
